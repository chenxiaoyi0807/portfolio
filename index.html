<script>
  // Reloading a plain homepage URL should replay the opening from the top.
  const homePath = '%BASE_URL%'.replace(/\/?$/, '/');
  const isHome = location.pathname === homePath || location.pathname === homePath.slice(0, -1);
  const navigation = performance.getEntriesByType('navigation')[0];
  if (isHome && !location.hash && navigation?.type === 'reload' && 'scrollRestoration' in history) {
    const previous = history.scrollRestoration;
    history.scrollRestoration = 'manual';
    addEventListener('pageshow', () => {
      requestAnimationFrame(() => { history.scrollRestoration = previous; });
    }, { once: true });
  }
</script>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
